    />
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var uaDataMobile =
            navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean'
              ? navigator.userAgentData.mobile
              : null;
          var isMobileUA =
            uaDataMobile !== null
              ? uaDataMobile
              : /Android.*Mobile|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
          var screenShortSide = Math.min(
            window.screen ? window.screen.width : 1024,
            window.screen ? window.screen.height : 768
          );
          var isTouchCompactScreen =
            (navigator.maxTouchPoints || 0) > 0 && screenShortSide > 0 && screenShortSide < 768;
          var isDesktopMode = !isMobileUA || window.innerWidth >= 768;
          var meta = document.getElementById('app-viewport');

          if (isDesktopMode) {
            document.documentElement.setAttribute('data-layout-mode', 'desktop');
            if (meta) {
              meta.setAttribute(
                'content',
                isTouchCompactScreen
                  ? 'width=1200, user-scalable=yes, minimum-scale=0.2, maximum-scale=5.0'
                  : 'width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.25, maximum-scale=5.0'
              );
            }
          } else {
            document.documentElement.setAttribute('data-layout-mode', 'mobile');
            if (meta) {
              meta.setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'
              );
            }
          }
        } catch (e) {}
      })();
    </script>
